name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - docs/site/**
      - skills/**
      - scripts/stage-skill-bundle.py
      - .github/workflows/pages.yml
      - .github/actions/build-docs/**
      # The docs read the displayed version from Cargo.toml at build time, so a
      # version bump must redeploy the site even when no docs/site file changed.
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build documentation
        uses: ./.github/actions/build-docs

      - name: Stage hosted skill bundle
        run: python3 scripts/stage-skill-bundle.py --source skills/snow-cli --out docs/site/dist/skills/snow-cli

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
