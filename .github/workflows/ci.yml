name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        # libdbus-1-dev is required to build libdbus-sys (pulled in transitively
        # via the secret-store/keyring path); it is not present on the runner by
        # default and its absence fails the build before fmt/clippy/test run.
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check skill command examples parse
        # Offline: runs every `snow-cli` example in skills/ against a profile
        # with no network or credentials and fails on argument-parser errors.
        run: cargo build --bins && python3 scripts/check-skill-examples.py

  docs:
    # Runs on every PR (not path-filtered) so it can be a required check and
    # docs-site dependency bumps are built before they merge.
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build documentation
        uses: ./.github/actions/build-docs
