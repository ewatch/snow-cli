name = "domain-status"
description = "Inspect domain activation and home domain without claiming effective visibility"
requires = ["credentials"]

[[setup]]
args = ["profile", "add", "e2e-domain", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[[setup]]
shell = 'printf "%s" "$SNOW_E2E_PASSWORD" | "$SNOW_CLI_BIN" --profile e2e-domain auth login --password-stdin'

[command]
args = ["domain", "status", "--profile", "e2e-domain", "--output", "json"]

[expect]
exit_code = 0
stdout_contains = ['"enabled":', '"properties":', '"session_domain":null']
json_field_present = [".note"]

[[cleanup]]
args = ["profile", "remove", "e2e-domain", "--yes"]
