name = "session-login"
description = "Create a disposable dedicated native cookie profile using a password through stdin"
requires = ["credentials", "native-session"]

[[setup]]
args = ["profile", "add", "e2e-native-source", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[command]
shell = 'printf "%s" "$SNOW_E2E_PASSWORD" | "$SNOW_CLI_BIN" --profile e2e-native-source session login e2e-native --password-stdin --output json'

[expect]
exit_code = 0
stdout_contains = ['"status":"ready"', '"auth_method":"native_session"', '"stored":true']
json_field_present = [".authenticated_user"]

[[cleanup]]
args = ["session", "forget", "--profile", "e2e-native"]

[[cleanup]]
args = ["profile", "remove", "e2e-native", "--yes"]

[[cleanup]]
args = ["profile", "remove", "e2e-native-source", "--yes"]
