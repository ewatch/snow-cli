name = "auth-token"
description = "Refuse to print a Basic profile's long-lived credential without --reveal"
requires = ["credentials"]

# For non-OAuth2 profiles the token is the long-lived credential itself, so
# `auth token` refuses without --reveal. Asserting the refusal keeps the Basic
# credential out of artifacts.

[[setup]]
description = "Create the scenario profile"
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[[setup]]
description = "Store credentials for the scenario profile"
shell = "printf '%s' \"$SNOW_E2E_PASSWORD\" | \"$SNOW_CLI_BIN\" auth login --profile e2e-scenario --password-stdin"

[command]
args = ["auth", "token", "--profile", "e2e-scenario"]

[expect]
exit_code = 2
stderr_contains = ["VALIDATION_ERROR", "--reveal"]

[[fuzzy]]
expectation = "Nothing is printed to stdout, and the error explains that only OAuth2 profiles print a short-lived token and that --reveal prints the long-lived credential."

[[cleanup]]
description = "Clear stored credentials"
args = ["auth", "logout", "--profile", "e2e-scenario"]
allow_failure = true

[[cleanup]]
description = "Remove the scenario profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
