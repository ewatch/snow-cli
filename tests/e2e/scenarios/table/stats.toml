name = "table-stats"
description = "Aggregate/count records via the Stats (Aggregate) API with a --having filter (read-only)"
requires = ["credentials"]

[[setup]]
description = "Create the scenario profile"
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[[setup]]
description = "Store credentials for the scenario profile"
shell = "printf '%s' \"$SNOW_E2E_PASSWORD\" | \"$SNOW_CLI_BIN\" auth login --profile e2e-scenario --password-stdin"

[command]
args = ["table", "stats", "incident", "--group-by", "priority", "--having", "count>0", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
stdout_contains = ["\"count\":"]
json_field_present = [".[0].priority", ".[0].count"]

[[fuzzy]]
expectation = "The output reports a per-priority count of incident records as plain scalar values (no raw `{value, display_value}` objects when `--display-value` is omitted), and each group has a numeric count greater than 0 (the --having count>0 filter was accepted, not rejected with HTTP 400)."

[[cleanup]]
description = "Remove the scenario profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
