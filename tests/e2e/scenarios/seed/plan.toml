name = "seed-plan"
description = "seed plan validates and orders a declarative seed spec offline"

# Planning is local and does not need instance credentials or network access.
requires = ["none"]

[[setup]]
description = "Create an offline profile (planning makes no network requests)"
args = ["profile", "add", "e2e-scenario", "--instance", "https://e2e-offline.example.service-now.com", "--auth-method", "basic", "--username", "e2e-user"]

[[setup]]
description = "Write a seed spec with a referenced table"
shell = "f=$(mktemp \"${TMPDIR:-/tmp}/snow-cli-e2e-seed.XXXXXX\") && mv \"$f\" \"$f.json\" && f=\"$f.json\" && printf '%s' '{\"version\":1,\"kind\":\"seed-spec\",\"seed\":42,\"tables\":[{\"name\":\"incident\",\"count\":2,\"template\":{\"short_description\":\"Generated incident\"},\"references\":{\"location\":{\"table\":\"cmn_location\",\"strategy\":\"round_robin\"}}},{\"name\":\"cmn_location\",\"records\":[{\"name\":\"Berlin\"}]}]}' > \"$f\" && printf '%s' \"$f\""
capture = { spec_path = "raw" }

[command]
args = ["seed", "plan", "--file", "{{spec_path}}", "--profile", "e2e-scenario"]

[expect]
exit_code = 0
stdout_contains = ["seed-plan", "cmn_location", "incident", "\"total_records\":3"]

[[cleanup]]
description = "Remove the seed spec fixture"
shell = "rm -f \"{{spec_path}}\""
allow_failure = true

[[cleanup]]
description = "Remove the offline profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
