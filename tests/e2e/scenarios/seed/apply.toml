name = "seed-apply-dry-run"
description = "seed apply dry-run validates specs without credentials or network"
requires = ["none"]

[[setup]]
description = "Create an offline profile"
args = ["profile", "add", "e2e-scenario", "--instance", "https://e2e-offline.example.service-now.com", "--auth-method", "basic", "--username", "e2e-user"]

[[setup]]
description = "Write a minimal seed spec fixture"
shell = "f=$(mktemp \"${TMPDIR:-/tmp}/snow-cli-e2e-seed.XXXXXX\") && mv \"$f\" \"$f.json\" && f=\"$f.json\" && printf '%s' '{\"version\":1,\"kind\":\"seed-spec\",\"tables\":[{\"name\":\"incident\",\"records\":[{\"short_description\":\"Preview only\"}]}]}' > \"$f\" && printf '%s' \"$f\""
capture = { spec_path = "raw" }

[command]
args = ["seed", "apply", "--file", "{{spec_path}}", "--dry-run", "--profile", "e2e-scenario"]

[expect]
exit_code = 0
stdout_contains = ["seed-plan", "incident", "\"total_records\":1"]

[[cleanup]]
description = "Remove the seed spec fixture"
shell = "rm -f \"{{spec_path}}\""
allow_failure = true

[[cleanup]]
description = "Remove the offline profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
