name = "include-show"
description = "Inspect an out-of-the-box script include and its inheritance chain (read-only)"
requires = ["credentials"]

[[setup]]
description = "Create the scenario profile"
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[[setup]]
description = "Store credentials for the scenario profile"
shell = "printf '%s' \"$SNOW_E2E_PASSWORD\" | \"$SNOW_CLI_BIN\" auth login --profile e2e-scenario --password-stdin"

[command]
args = ["include", "show", "AbstractAjaxProcessor", "--chain", "--no-script", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
stdout_contains = ["AbstractAjaxProcessor", "outline"]
json_field_present = [".includes[0].name", ".includes[0].sys_id", ".includes[0].outline"]

[[fuzzy]]
expectation = "Returns the parsed prototype outline and metadata for `AbstractAjaxProcessor` under `.includes[0]` without dumping full script source."

[[cleanup]]
description = "Remove the scenario profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
