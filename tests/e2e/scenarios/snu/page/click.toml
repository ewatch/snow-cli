name = "snu-page-click"
description = "Click a safe page element through the community Agent API"
requires = ["sn-utils-bridge", "credentials"]

[[setup]]
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]
[[setup]]
args = ["snu", "page", "navigate", "$SNOW_E2E_INSTANCE_URL/incident_list.do", "--new-tab", "--profile", "e2e-scenario", "--output", "json"]
capture = { tab_id = ".tabId" }

[command]
args = ["snu", "page", "click", "body", "--tab-id", "{{tab_id}}", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
json_field_present = [".success == true", ".selector == \"body\""]

[[cleanup]]
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
