name = "snu-page-run-ui-action"
description = "Save a disposable incident through the community Agent API"
requires = ["sn-utils-bridge", "credentials"]

[[setup]]
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]
[[setup]]
args = ["snu", "create-record", "incident", "--data", "{\"short_description\":\"snow-cli e2e: page run-ui-action\"}", "--profile", "e2e-scenario", "--output", "json"]
capture = { sys_id = ".sys_id" }
[[setup]]
args = ["snu", "page", "navigate", "$SNOW_E2E_INSTANCE_URL/incident.do?sys_id={{sys_id}}", "--new-tab", "--profile", "e2e-scenario", "--output", "json"]
capture = { tab_id = ".tabId" }

[command]
args = ["snu", "page", "run-ui-action", "save", "--tab-id", "{{tab_id}}", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
json_field_present = [".success == true", ".uiAction == \"save\""]

[[cleanup]]
args = ["snu", "delete-record", "incident", "--sys-id", "{{sys_id}}", "--profile", "e2e-scenario"]
allow_failure = true
[[cleanup]]
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
