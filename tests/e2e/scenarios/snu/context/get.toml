name = "snu-context-get"
description = "Read the active application scope and update set through the SN-Utils Agent API"
requires = ["sn-utils-bridge", "credentials"]

[[setup]]
description = "Create the scenario profile (instance context; bridge provides the session)"
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[command]
args = ["snu", "context", "get", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
json_field_present = [
  ".success == true",
  ".context.instance | type == \"string\" and length > 0",
]

[[fuzzy]]
expectation = "The response identifies the current application scope and update set without exposing browser session credentials."

[[cleanup]]
description = "Remove the scenario profile"
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
