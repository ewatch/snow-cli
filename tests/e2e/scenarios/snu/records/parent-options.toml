name = "snu-records-parent-options"
description = "Fetch reference choices through the SN-Utils Agent API"
requires = ["sn-utils-bridge", "credentials"]

[[setup]]
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[command]
args = ["snu", "records", "parent-options", "sys_db_object", "--fields", "sys_id,name", "--name-field", "name", "--limit", "5", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
json_field_present = [".success == true", ".result | type == \"array\""]

[[cleanup]]
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
