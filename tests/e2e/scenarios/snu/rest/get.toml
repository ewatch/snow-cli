name = "snu-rest-get"
description = "Read a Table API record through the SN-Utils Agent REST API"
requires = ["sn-utils-bridge", "credentials"]

[[setup]]
args = ["profile", "add", "e2e-scenario", "--instance", "$SNOW_E2E_INSTANCE_URL", "--auth-method", "basic", "--username", "$SNOW_E2E_USERNAME"]

[command]
args = ["snu", "rest", "get", "/api/now/table/sys_user", "--query-param", "sysparm_fields=sys_id", "--query-param", "sysparm_limit=1", "--profile", "e2e-scenario", "--output", "json"]

[expect]
exit_code = 0
json_field_present = [".success == true", ".status == 200", ".data.result | type == \"array\""]

[[cleanup]]
args = ["profile", "remove", "e2e-scenario", "--yes"]
allow_failure = true
